<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyWriter lite</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
:root {
  color-scheme: light;
  --ew-bg: #ede1c3;
  --ew-bg-panel: #e2d1a3;
  --ew-bg-panel-hover: #d6c294;
  --ew-text: #2c1d11;
  --ew-text-muted: #6b5a41;
  --ew-border: #b6976a;
  --ew-accent: #c1441f;
  --ew-accent-2: #e0a028;
  --ew-link: #2f5d8a;
  --ew-code-bg: #dccca3;
  --ew-paper: #fbf6e8;
}

* {
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  display: flex;
  flex-direction: column;
  background: var(--ew-bg);
  color: var(--ew-text);
  font-family: Meiryo, "MS UI Gothic", sans-serif;
  line-height: 1.5;
  overflow-wrap: break-word;
}

.site-logo {
  flex: 0 0 auto;
  height: 40px;
  width: auto;
  display: block;
}

main {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

button {
  font-family: inherit;
  font-size: 0.95rem;
  color: var(--ew-text);
  background: var(--ew-bg-panel);
  border: 1px solid var(--ew-border);
  border-radius: 6px;
  padding: 0.4rem 0.8rem;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 1px 2px rgba(44, 29, 17, 0.2);
  cursor: pointer;
  white-space: nowrap;
}

button:hover {
  background: var(--ew-bg-panel-hover);
}

button:active {
  box-shadow: inset 0 1px 3px rgba(44, 29, 17, 0.3);
}

a {
  color: var(--ew-link);
}

.editor-toolbar-bar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.6rem;
  background: var(--ew-bg-panel);
  padding: 0.35rem 1rem;
  border-bottom: 2px solid var(--ew-border);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4);
}

.editor-path {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ew-text-muted);
  font-size: 0.9rem;
}

.save-status {
  flex: 0 0 auto;
  color: var(--ew-text-muted);
  font-size: 0.8rem;
  white-space: nowrap;
}

.color-panel {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.8rem;
  padding: 0.5rem 1rem;
  background: var(--ew-paper);
  border-bottom: 2px solid var(--ew-border);
}

.color-panel label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: var(--ew-text-muted);
}

.color-panel input[type="color"] {
  width: 2rem;
  height: 1.6rem;
  padding: 0;
  border: 1px solid var(--ew-border);
  border-radius: 4px;
  cursor: pointer;
}

.fs-hint {
  flex: 0 0 auto;
  padding: 0.4rem 1rem;
  background: var(--ew-paper);
  border-bottom: 2px solid var(--ew-border);
  color: var(--ew-text-muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.fs-hint code {
  font-family: Consolas, "MS Gothic", monospace;
  background: var(--ew-code-bg);
  padding: 0.05rem 0.3rem;
  border-radius: 4px;
}

.view-toggle {
  display: none;
}

@media (min-width: 901px) {
  .wide-preview-only .editor-pane {
    display: none;
  }
  .wide-preview-only .live-preview {
    flex: 1 1 100%;
  }
}

@media (max-width: 900px) {
  .wide-preview-toggle {
    display: none;
  }
}

.edit-layout {
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
}

.live-preview,
.editor-pane {
  flex: 1 1 50%;
  min-width: 0;
  min-height: 0;
  height: 100%;
}

.live-preview {
  overflow-y: auto;
  padding: 1.5rem;
  background: var(--ew-paper);
  border-right: 2px solid var(--ew-border);
}

.editor-pane {
  display: flex;
  flex-direction: column;
}

.editor-pane .EasyMDEContainer {
  height: 100%;
  display: flex;
  flex-direction: column;
}

.editor-pane .EasyMDEContainer .CodeMirror {
  flex: 1 1 auto;
  min-height: 0;
  height: auto !important;
  background: var(--ew-paper);
  color: var(--ew-text);
  font-family: Meiryo, "MS UI Gothic", sans-serif;
}

.editor-pane .editor-toolbar {
  flex: 0 0 auto;
  background: var(--ew-bg-panel);
  border-bottom: 1px solid var(--ew-border);
  opacity: 1;
}

.editor-pane .editor-toolbar button {
  color: var(--ew-text) !important;
  border: 1px solid transparent;
  border-radius: 4px;
}

.editor-pane .editor-toolbar button:hover,
.editor-pane .editor-toolbar button.active {
  background: var(--ew-bg-panel-hover) !important;
  border-color: var(--ew-border);
}

.editor-pane .editor-toolbar i.separator {
  border-left: 1px solid var(--ew-border);
}

.editor-pane .editor-statusbar {
  flex: 0 0 auto;
  padding: 0.2rem 0.6rem;
  font-size: 0.8rem;
  color: var(--ew-text-muted);
  background: var(--ew-bg-panel);
  border-top: 1px solid var(--ew-border);
  min-height: 1.2em;
}

@media (max-width: 900px) {
  .edit-layout {
    flex-direction: column;
  }
  .pane-hidden {
    display: none;
  }
  .view-toggle {
    display: inline-block;
  }
  .save-status {
    display: none;
  }
}

.entry-body h1 {
  font-size: 1.5rem;
  color: var(--ew-accent);
}

.entry-body h2 {
  font-size: 1.25rem;
  color: var(--ew-accent);
}

.entry-body img {
  max-width: 100%;
  border-radius: 4px;
}

.entry-body blockquote {
  margin: 1rem 0;
  padding: 0.6rem 1rem;
  border-left: 4px solid var(--ew-accent-2);
  background: rgba(224, 160, 40, 0.12);
}

.entry-body code {
  font-family: Consolas, "MS Gothic", monospace;
  background: var(--ew-code-bg);
  padding: 0.1rem 0.3rem;
  border-radius: 4px;
}

.entry-body pre {
  background: var(--ew-code-bg);
  padding: 0.8rem;
  border-radius: 6px;
  overflow-x: auto;
}

.entry-body pre code {
  background: none;
  padding: 0;
}

.entry-body table {
  border-collapse: collapse;
  width: 100%;
}

.entry-body th,
.entry-body td {
  border: 1px solid var(--ew-border);
  padding: 0.4rem 0.6rem;
}

.entry-body th {
  background: var(--ew-bg-panel);
}

.ai-badge {
  position: fixed;
  right: 0.6rem;
  bottom: 0.6rem;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  opacity: 0.4;
  z-index: 50;
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
  animation: ai-badge-float 4s ease-in-out infinite;
  pointer-events: none;
}

@keyframes ai-badge-float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

@media print {
  .editor-toolbar-bar,
  .editor-pane,
  .ai-badge {
    display: none !important;
  }

  html, body, main, .edit-layout {
    height: auto !important;
    display: block !important;
    overflow: visible !important;
  }

  .live-preview {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
    width: 100% !important;
    flex: none !important;
    border: none !important;
    padding: 0 !important;
  }
}
</style>
</head>
<body>
<main>
<div class="editor-toolbar-bar">
  <img class="site-logo" id="site_logo" alt="EasyWriter">
  <span class="editor-path" id="editor_path_label">(未保存)</span>
  <span class="save-status" id="save_status"></span>
  <button type="button" id="open_button">開く</button>
  <button type="button" id="save_button">保存</button>
  <button type="button" id="save_as_button">名前を付けて保存</button>
  <button type="button" id="view_toggle" class="view-toggle">プレビューを見る</button>
  <button type="button" id="wide_preview_toggle" class="wide-preview-toggle">ビュアのみ表示</button>
  <button type="button" id="color_toggle">配色</button>
</div>
<div class="color-panel" id="color_panel" style="display:none">
  <label>背景<input type="color" id="color_bg" data-var="--ew-paper"></label>
  <label>ボタン・バー<input type="color" id="color_panel_bg" data-var="--ew-bg-panel"></label>
  <label>文字<input type="color" id="color_text" data-var="--ew-text"></label>
  <label>見出し・強調<input type="color" id="color_accent" data-var="--ew-accent"></label>
  <label>リンク<input type="color" id="color_link" data-var="--ew-link"></label>
  <button type="button" id="color_reset">既定の色に戻す</button>
</div>
<div class="fs-hint" id="fs_hint" style="display:none">
  お使いのブラウザでは「保存」がファイルへの直接上書きに対応していないため、ダウンロードフォルダへの保存になります(Chrome/Edgeなら直接上書きできます)。<br>
  Braveをお使いの場合は、アドレスバーに <code>brave://flags/#file-system-access-api</code> と入力してEnabledにし、再起動すると直接上書きできるようになります。
</div>
<input type="file" id="import_file_input" accept=".md,text/markdown" style="display:none">
<div class="edit-layout" id="edit_layout">
  <div class="live-preview pane-hidden" id="pane_preview">
    <div id="preview_body" class="entry-body"></div>
  </div>
  <div class="editor-pane" id="pane_editor">
    <textarea id="body_markdown"></textarea>
  </div>
</div>
</main>
<img class="ai-badge" id="ai_badge" alt="Claude Code" title="Claude Codeで構築">

  function insertLink(editor) {
    var cm = editor.codemirror;
    var url = window.prompt("リンク先のURL:", "https://");
    if (!url) return;
    if (!/%[0-9a-fA-F]{2}/.test(url)) {
      url = encodeURI(url);
    }
    url = url.replace(/([\\()])/g, "\\$1");

    var from = cm.getCursor("from");
    var to = cm.getCursor("to");
    var label = cm.getSelection();
    cm.replaceSelection("[" + label + "](" + url + ")");

    if (label) {
      cm.setSelection({ line: from.line, ch: from.ch + 1 }, { line: to.line, ch: to.ch + 1 });
    } else {
      cm.setCursor({ line: from.line, ch: from.ch + 1 });
    }
    cm.focus();
  }

  // 画像はアップロード/埋め込みせず、URLを手で入力してリンクを貼るだけの
  // 軽い操作にする(ファイル本体を持ち込まない、本文が肥大化しない)。
  // ブラウザはファイル選択ダイアログから元ファイルの本当のパスを教えてくれない
  // (セキュリティ上の制約で握りつぶされる)ので、手元の画像はWindowsのエクス
  // プローラーで「パスをコピー」した文字列を貼ってもらい、ここで file:/// URL
  // に変換する。<img src="file:///...">は同一フォルダでなくても表示できる
  function windowsPathToFileUrl(input) {
    var p = input.trim();
    if (/^".*"$/.test(p)) p = p.slice(1, -1);
    if (!/^[A-Za-z]:\\/.test(p)) return null;
    return "file:///" + p.replace(/\\/g, "/");
  }

  function insertImage(editor) {
    var cm = editor.codemirror;
    var input = window.prompt(
      "画像のURL、またはWindowsのエクスプローラーで画像を右クリック→「パスをコピー」した文字列を貼り付けてください:",
      ""
    );
    if (!input) return;
    var url = windowsPathToFileUrl(input) || input;
    if (!/%[0-9a-fA-F]{2}/.test(url)) {
      url = encodeURI(url);
    }
    url = url.replace(/([\\()])/g, "\\$1");

    var from = cm.getCursor("from");
    var to = cm.getCursor("to");
    var label = cm.getSelection();
    cm.replaceSelection("![" + label + "](" + url + ")");

    if (label) {
      cm.setSelection({ line: from.line, ch: from.ch + 2 }, { line: to.line, ch: to.ch + 2 });
    } else {
      cm.setCursor({ line: from.line, ch: from.ch + 2 });
    }
    cm.focus();
  }

  var easyMDE = new EasyMDE({
    element: document.getElementById("body_markdown"),
    spellChecker: false,
    status: false,
    shortcuts: { drawLink: null },
    tabSize: 4,
    indentWithTabs: false,
    unorderedListStyle: "-",
    toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list",
              "|", { name: "link", action: insertLink, className: "fa fa-link", title: "リンク" },
              { name: "image", action: insertImage, className: "fa fa-picture-o", title: "画像(URL)" },
              "|", "fullscreen", "|", "guide"],
  });

  marked.setOptions({ gfm: true, breaks: false });

  var previewBody = document.getElementById("preview_body");
  var editorPathLabel = document.getElementById("editor_path_label");
  var saveStatus = document.getElementById("save_status");
  var relPath = "";
  var lastImportedBaseName = "";
  var debounceTimer = null;
  var formDirty = false;

  function timestampSuffix() {
    var d = new Date();
    function pad(n) { return String(n).padStart(2, "0"); }
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate())
      + "-" + pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }

  function defaultFileName() {
    var base = lastImportedBaseName || "note";
    return base + "_" + timestampSuffix() + ".md";
  }

  function updatePreview() {
    previewBody.innerHTML = marked.parse(easyMDE.value());
  }

  easyMDE.codemirror.on("change", function () {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(updatePreview, 400);
    saveStatus.textContent = "";
    formDirty = true;
  });

  updatePreview();

  // 自動保存はしない(ユーザーの意図しない書き換えを避けるため)。
  // その代わり、保存していない変更があるままタブを閉じようとしたら
  // ブラウザ標準の確認ダイアログで気づけるようにする
  window.addEventListener("beforeunload", function (e) {
    if (formDirty) {
      e.preventDefault();
      e.returnValue = true;
      return true;
    }
  });

  // File System Access API(showOpenFilePicker/showSaveFilePicker)に対応した
  // ブラウザ(Chrome/Edge/Brave等)では、開いたファイルのハンドルを覚えておいて
  // 「保存」のたびにダウンロードフォルダへ新規ダンプするのではなく同じファイルへ
  // 直接上書きする。未対応ブラウザ(Firefox/Safari)では従来のinput+Blobダウン
  // ロード方式にフォールバックする
  var hasFsAccess = "showOpenFilePicker" in window && "showSaveFilePicker" in window;
  if (!hasFsAccess) {
    document.getElementById("fs_hint").style.display = "block";
  }
  var currentHandle = null;
  var mdFileTypes = [{ description: "Markdown", accept: { "text/markdown": [".md"] } }];

  async function ensureWritePermission(handle) {
    if ((await handle.queryPermission({ mode: "readwrite" })) === "granted") return true;
    return (await handle.requestPermission({ mode: "readwrite" })) === "granted";
  }

  async function writeToHandle(handle) {
    if (!(await ensureWritePermission(handle))) {
      alert("保存の権限が得られませんでした。");
      return false;
    }
    var writable = await handle.createWritable();
    await writable.write(easyMDE.value());
    await writable.close();
    return true;
  }

  function legacyDownload() {
    var blob = new Blob([easyMDE.value()], { type: "text/markdown;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = relPath ? relPath.split("/").pop() : defaultFileName();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function openFile() {
    if (easyMDE.value() && !window.confirm("現在の内容を置き換えます。開くのを続けますか?")) {
      return;
    }
    if (!hasFsAccess) {
      document.getElementById("import_file_input").click();
      return;
    }
    var handle;
    try {
      [handle] = await window.showOpenFilePicker({ types: mdFileTypes });
    } catch (e) {
      return; // ユーザーがキャンセルした場合など
    }
    var file = await handle.getFile();
    var text = await file.text();
    currentHandle = handle;
    relPath = file.name;
    lastImportedBaseName = file.name.replace(/\.md$/i, "");
    editorPathLabel.textContent = relPath;
    document.title = relPath + " — EasyWriter lite";
    easyMDE.value(text);
    updatePreview();
    formDirty = false;
  }

  async function saveFile(forceSaveAs) {
    if (!hasFsAccess) {
      legacyDownload();
      return;
    }
    var handle = currentHandle;
    if (!handle || forceSaveAs) {
      try {
        handle = await window.showSaveFilePicker({
          suggestedName: relPath || defaultFileName(),
          types: mdFileTypes,
        });
      } catch (e) {
        return; // キャンセル
      }
    }
    if (!(await writeToHandle(handle))) return;
    currentHandle = handle;
    relPath = handle.name;
    editorPathLabel.textContent = relPath;
    document.title = relPath + " — EasyWriter lite";
    saveStatus.textContent = "保存しました";
    formDirty = false;
  }

  document.getElementById("open_button").addEventListener("click", openFile);
  document.getElementById("save_button").addEventListener("click", function () { saveFile(false); });
  document.getElementById("save_as_button").addEventListener("click", function () { saveFile(true); });

  document.getElementById("import_file_input").addEventListener("change", function (e) {
    var file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    lastImportedBaseName = file.name.replace(/\.md$/i, "");
    relPath = file.name;
    var reader = new FileReader();
    reader.onload = function () {
      editorPathLabel.textContent = relPath;
      document.title = relPath + " — EasyWriter lite";
      easyMDE.value(reader.result);
      updatePreview();
      formDirty = false;
    };
    reader.readAsText(file, "utf-8");
  });

  var viewToggle = document.getElementById("view_toggle");
  var paneEditor = document.getElementById("pane_editor");
  var panePreview = document.getElementById("pane_preview");
  viewToggle.addEventListener("click", function () {
    var showingPreview = panePreview.classList.contains("pane-hidden");
    paneEditor.classList.toggle("pane-hidden");
    panePreview.classList.toggle("pane-hidden");
    viewToggle.textContent = showingPreview ? "編集に戻る" : "プレビューを見る";
  });

  var widePreviewToggle = document.getElementById("wide_preview_toggle");
  var editLayout = document.getElementById("edit_layout");
  widePreviewToggle.addEventListener("click", function () {
    var previewOnly = editLayout.classList.toggle("wide-preview-only");
    widePreviewToggle.textContent = previewOnly ? "両方表示" : "ビュアのみ表示";
  });

  // 配色カスタマイズ: CSS変数(:root)に出してある色のうち主要5色だけを
  // その場で変更できるようにする。選んだ色はこのブラウザにだけ覚えさせる
  // (文書の中身とは無関係の、見た目の好みなので localStorage でよい)
  var THEME_STORAGE_KEY = "easywriter_lite_theme";
  var defaultColors = {
    "--ew-paper": "#fbf6e8",
    "--ew-bg-panel": "#e2d1a3",
    "--ew-text": "#2c1d11",
    "--ew-accent": "#c1441f",
    "--ew-link": "#2f5d8a",
  };
  var colorInputs = document.querySelectorAll("#color_panel input[type=color]");

  function applyColor(varName, value) {
    document.documentElement.style.setProperty(varName, value);
  }

  function loadTheme() {
    var saved = {};
    try {
      saved = JSON.parse(localStorage.getItem(THEME_STORAGE_KEY) || "{}");
    } catch (e) {
      saved = {};
    }
    colorInputs.forEach(function (input) {
      var varName = input.dataset.var;
      var value = saved[varName] || defaultColors[varName];
      input.value = value;
      applyColor(varName, value);
    });
  }

  function saveTheme() {
    var theme = {};
    colorInputs.forEach(function (input) {
      theme[input.dataset.var] = input.value;
    });
    try {
      localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(theme));
    } catch (e) {
      // localStorageが使えなくても配色自体は反映済みなので無視してよい
    }
  }

  colorInputs.forEach(function (input) {
    input.addEventListener("input", function () {
      applyColor(input.dataset.var, input.value);
      saveTheme();
    });
  });

  document.getElementById("color_reset").addEventListener("click", function () {
    try {
      localStorage.removeItem(THEME_STORAGE_KEY);
    } catch (e) {}
    loadTheme();
  });

  document.getElementById("color_toggle").addEventListener("click", function () {
    var panel = document.getElementById("color_panel");
    panel.style.display = panel.style.display === "none" ? "flex" : "none";
  });

  loadTheme();

  // mdファイルをブラウザに関連付けて直接開く(生のテキストが表示される)→
  // ブックマークレットでそのタブの中身とパスをURLの#フラグメントに載せて
  // このページへ飛ばす、という2アクションの橋渡しをここで受け止める。
  // #open=<base64のファイル名>:<base64の本文>
  function fromB64(b64) {
    var binary = atob(b64);
    var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
    return new TextDecoder("utf-8").decode(bytes);
  }

  (function loadFromHash() {
    var hash = location.hash;
    if (hash.indexOf("#open=") !== 0) return;
    var payload = hash.slice("#open=".length);
    var sep = payload.indexOf(":");
    if (sep < 0) return;
    try {
      var name = fromB64(payload.slice(0, sep));
      var body = fromB64(payload.slice(sep + 1));
    } catch (e) {
      return;
    }
    history.replaceState(null, "", location.pathname + location.search);
    relPath = name;
    lastImportedBaseName = name.replace(/\.md$/i, "");
    editorPathLabel.textContent = relPath;
    document.title = relPath + " — EasyWriter lite";
    easyMDE.value(body);
    updatePreview();
    formDirty = false;
    saveStatus.textContent = "関連付けから読み込みました(保存は最初に「名前を付けて保存」を)";
  })();
</script>
</body>
</html>
